name: Repository and G3 CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tools -p 'test_g3a_snapshot.py'
  g3-cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/student-state-guidance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: experiments/student-state-guidance/requirements-cpu.txt
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-cpu.txt
      - run: bash scripts/test_g3_cpu.sh
